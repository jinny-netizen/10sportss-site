var PIXEL = "1022917280660411";

    try { return m ? decodeURIComponent(m[1].replace(/\+/g, " ")) : null; } catch (e) { return m ? m[1] : null; }
  }
  function enc(o) {
    var s = [], k;
    for (k in o) if (o[k] != null && o[k] !== "") s.push(k + "=" + encodeURIComponent(o[k]));
    return s.join("&");
  }
  // Pass ad attribution (utm_*, gclid, fbclid, src) through to the sign-up page.
  var add = [], ps = location.search.replace(/^\?/, "").split("&"), i;
  for (i = 0; i < ps.length; i++) if (/^(utm_[a-z]+|src|gclid|fbclid)=/.test(ps[i])) add.push(ps[i]);
  window.GO = SIGNUP + (add.length ? "&" + add.join("&") : "");
  if (qp("preview")) return;

  try {
    var now = new Date().getTime(), fbp = (document.cookie.match(/(?:^|; )_fbp=([^;]+)/) || [])[1];
    if (!fbp) { fbp = "fb.1." + now + "." + Math.floor(Math.random() * 1e10); document.cookie = "_fbp=" + fbp + ";max-age=7776000;path=/"; }
    var c = qp("fbclid");
    var u = "https://www.facebook.com/tr/?" + enc({ id: PIXEL, ev: "PageView", dl: location.href, rl: document.referrer, ts: now, fbp: fbp,
      fbc: c ? "fb.1." + now + "." + c : null, eid: "pageview." + now + "." + Math.random().toString(36).slice(2, 10) });
    if (window.fetch) fetch(u, { mode: "no-cors", keepalive: true, credentials: "include" })["catch"](function () {});
    else new Image().src = u;
  } catch (e) {}
  try {

      fetch(STATS, { method: "POST", body: body, keepalive: true, headers: { "Content-Type": "text/plain" } })["catch"](function () {});
  } catch (e) {}
  // Leave at once; replace() keeps this page out of the back button.
  location.replace(window.GO);
})();
